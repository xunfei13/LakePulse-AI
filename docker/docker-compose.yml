# 面向 16GB 内存宿主机的 LakePulse-AI 轻量伪分布式大数据集群编排
# 总内存上限约 6.5 GB: namenode(1G) + datanode(1G) + hive-metastore(1G) + spark-master(1G) + spark-worker(2.5G)

services:
  namenode:
    image: apache/hadoop:3.3.6
    container_name: lakepulse-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    mem_limit: 1024m
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_namenode:/tmp/hadoop-root/dfs/name
      - ../data:/opt/lakepulse/data
    networks:
      - lakepulse-net

  datanode:
    image: apache/hadoop:3.3.6
    container_name: lakepulse-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    mem_limit: 1024m
    depends_on:
      - namenode
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
    volumes:
      - hdfs_datanode:/tmp/hadoop-root/dfs/data
      - ../data:/opt/lakepulse/data
    networks:
      - lakepulse-net

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: lakepulse-hms
    hostname: hive-metastore
    mem_limit: 1024m
    depends_on:
      - namenode
      - datanode
    environment:
      SERVICE_NAME: metastore
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
    ports:
      - "9083:9083"
    volumes:
      - hms_warehouse:/opt/hive/data/warehouse
    networks:
      - lakepulse-net

  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: lakepulse-spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    mem_limit: 1024m
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../:/opt/lakepulse/workspace
    networks:
      - lakepulse-net

  spark-worker:
    image: apache/spark:3.5.3-python3
    container_name: lakepulse-spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    mem_limit: 2560m
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_WEBUI_PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - ../:/opt/lakepulse/workspace
    networks:
      - lakepulse-net

volumes:
  hdfs_namenode:
  hdfs_datanode:
  hms_warehouse:

networks:
  lakepulse-net:
    driver: bridge
