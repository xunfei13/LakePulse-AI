[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakepulse"
version = "0.1.0"
description = "LakePulse-AI: Lakehouse Retail Demand Forecasting & Smart Replenishment Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark>=3.5.1,<3.6.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.26.0,<2.1.0",
    "tensorflow>=2.16.1,<2.19.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest_cache/tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
